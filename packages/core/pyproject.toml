[project]
name = "sscp-core"
version = "0.0.1"
description = "Analysis core: SBOM handling, advisory matching, reachability, VEX, attestation and policy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "packaging>=24.0",
    "semver>=3.0",
    "packageurl-python>=0.16",
    "pyyaml>=6.0",
    "msgpack>=1.1",
    "httpx>=0.28",
    "structlog>=24.4",
    "cyclonedx-python-lib>=8.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# SPDX support is read-mostly and its library is heavy, so it stays optional
# until the SPDX writer lands.
spdx = [
    "spdx-tools>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sscp_core"]
