[project]
name = "sscp-core"
version = "0.0.1"
description = "Analysis core: SBOM handling, advisory matching, reachability, VEX, attestation and policy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "packaging>=24.0",
    "packageurl-python>=0.16",
    "pyyaml>=6.0",
    "msgpack>=1.1",
    "httpx>=0.28",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Pulled in from M1 onward; kept separate so M0 installs stay small.
sbom = [
    "cyclonedx-python-lib>=8.0",
    "spdx-tools>=0.8",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sscp_core"]
