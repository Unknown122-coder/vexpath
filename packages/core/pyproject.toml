[project]
name = "vexpath-core"
version = "0.0.1"
description = "Analysis core: SBOM handling, advisory matching, reachability, VEX, attestation and policy."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["../../LICENSE"]
authors = [{ name = "Akmal Khan" }]
dependencies = [
    "pydantic>=2.9",
    "packaging>=24.0",
    "semver>=3.0",
    "packageurl-python>=0.16",
    "pyyaml>=6.0",
    "msgpack>=1.1",
    "httpx>=0.28",
    "structlog>=24.4",
    "cyclonedx-python-lib>=8.0",
    "jsonschema>=4.23",
    # CEL for policy evaluation. A real expression language rather than a
    # bespoke matcher, because a policy is a thing people write and share and
    # a home-grown syntax would have to be learned for one tool only.
    "cel-python>=0.1.5",
]

[project.optional-dependencies]
# SPDX support is read-mostly and its library is heavy, so it stays optional
# until the SPDX writer lands.
spdx = [
    "spdx-tools>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath_core"]
