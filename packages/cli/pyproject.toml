[project]
name = "sscp"
version = "0.0.1"
description = "Command-line tool: generate SBOMs, match advisories, analyse reachability and emit signed VEX."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sscp-core",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
sscp = "sscp.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sscp"]
