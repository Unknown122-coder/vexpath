[project]
name = "vexpath"
version = "0.1.0"
description = "Command-line tool: generate SBOMs, match advisories, analyse reachability and emit signed VEX."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# A copy, not a reference to the root. A parent-directory path lands in
# the source archive as `<name>-<version>/../../LICENSE`, which is a tar
# member escaping its own root: newer uv refuses to read it outright, and
# the archive was malformed regardless of which builder tolerated it. A
# test asserts every copy is byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [{ name = "Akmal Khan" }]
keywords = [
    "security",
    "sbom",
    "vulnerability",
    "reachability",
    "sca",
    "vex",
    "openvex",
    "cyclonedx",
    "spdx",
    "supply-chain",
]
# The PyPI page is where somebody decides whether to try this, so the
# classifiers say what it is rather than only what it needs. "Development
# Status :: 4 - Beta" is honest: the analysis is measured on real
# repositories, and the hosted platform is new.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]

dependencies = [
    "vexpath-core==0.1.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.urls]
Homepage = "https://github.com/Unknown122-coder/vexpath"
Documentation = "https://github.com/Unknown122-coder/vexpath/tree/main/docs"
Repository = "https://github.com/Unknown122-coder/vexpath"
Issues = "https://github.com/Unknown122-coder/vexpath/issues"
Changelog = "https://github.com/Unknown122-coder/vexpath/releases"

[project.scripts]
vexpath = "vexpath.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath"]
