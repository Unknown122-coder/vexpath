[project]
name = "vexpath-platform"
version = "0.0.1"
description = "Shared platform concerns: configuration, structured logging and object storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath_platform"]
