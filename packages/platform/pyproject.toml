[project]
name = "vexpath-platform"
version = "0.1.4"
description = "Shared platform concerns: configuration, structured logging and object storage."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# A copy, not a reference to the root. A parent-directory path lands in
# the source archive as `<name>-<version>/../../LICENSE`, which is a tar
# member escaping its own root: newer uv refuses to read it outright, and
# the archive was malformed regardless of which builder tolerated it. A
# test asserts every copy is byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [{ name = "Akmal Khan" }]
dependencies = [
    # For the API key *format* only (vexpath_core.keyformat), which lives in
    # the shared package so the command-line tool can recognise a key without
    # depending on this server package. vexpath-db already depends on the
    # core, so the core is the bottom layer either way.
    "vexpath-core==0.1.4",
    # A webhook signing secret has to be recoverable to sign with, so it is
    # encrypted at rest rather than hashed (see secretbox.py).
    "cryptography>=43.0",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath_platform"]
