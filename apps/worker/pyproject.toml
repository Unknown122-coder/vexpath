[project]
name = "vexpath-worker"
version = "0.1.3"
description = "Background jobs: advisory sync, patch diffing, call-graph builds, hosted scans and result ingest."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# A copy, not a reference to the root. A parent-directory path lands in
# the source archive as `<name>-<version>/../../LICENSE`, which is a tar
# member escaping its own root: newer uv refuses to read it outright, and
# the archive was malformed regardless of which builder tolerated it. A
# test asserts every copy is byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [{ name = "Akmal Khan" }]
dependencies = [
    "vexpath-core==0.1.3",
    "vexpath-db==0.1.3",
    "vexpath-platform==0.1.3",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath_worker"]
