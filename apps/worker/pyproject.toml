[project]
name = "vexpath-worker"
version = "0.0.1"
description = "Background jobs: advisory sync, patch diffing, call-graph builds, hosted scans and result ingest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vexpath-core",
    "vexpath-db",
    "vexpath-platform",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath_worker"]
