[project]
name = "sscp-worker"
version = "0.0.1"
description = "Background jobs: advisory sync, patch diffing, call-graph builds, hosted scans and result ingest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sscp-core",
    "sscp-db",
    "sscp-platform",
    "typer>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sscp_worker"]
