[project]
name = "vexpath-api"
version = "0.0.1"
description = "FastAPI service: the /v1 JSON API and the server-rendered web UI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["../../LICENSE"]
authors = [{ name = "Akmal Khan" }]
dependencies = [
    "vexpath-core",
    "vexpath-platform",
    "vexpath-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath_api"]
