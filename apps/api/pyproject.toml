[project]
name = "sscp-api"
version = "0.0.1"
description = "FastAPI service: the /v1 JSON API and the server-rendered web UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sscp-core",
    "sscp-platform",
    "sscp-db",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sscp_api"]
