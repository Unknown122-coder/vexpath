[project]
name = "vexpath-api"
version = "0.1.3"
description = "FastAPI service: the /v1 JSON API and the server-rendered web UI."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# A copy, not a reference to the root. A parent-directory path lands in
# the source archive as `<name>-<version>/../../LICENSE`, which is a tar
# member escaping its own root: newer uv refuses to read it outright, and
# the archive was malformed regardless of which builder tolerated it. A
# test asserts every copy is byte-identical to the root LICENSE.
license-files = ["LICENSE"]
authors = [{ name = "Akmal Khan" }]
dependencies = [
    "vexpath-core==0.1.3",
    "vexpath-platform==0.1.3",
    "vexpath-db==0.1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# Error reporting. Optional because a deployment with no DSN loses nothing but
# the reporting, and because this is a tool people run against their own code
# where sending nothing anywhere is the right default.
sentry = [
    "sentry-sdk>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vexpath_api"]
