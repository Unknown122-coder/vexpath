# Render deployment for the API and HTML UI.
#
# Why this exists next to infra/fly.toml: the Fly trial ended and the app was
# suspended, which took the hosted platform and the README's own badge down
# with it. fly.toml is kept rather than deleted -- it is a working
# configuration for a machine that does not sleep, and is what to come back to
# if this ever earns a card.
#
# At the repository root because that is where Render looks by default, the
# same compromise action.yml makes for the Marketplace. Nothing here carries a
# secret: everything secret is either generated by Render or entered once in
# the dashboard, which is what `sync: false` means.
#
# Deploy: connect this repository as a Blueprint at
# https://dashboard.render.com/blueprints -- there is no CLI step.

services:
  - type: web
    name: vexpath
    # The published image rather than a build from source: it is the release
    # artefact, it carries the SLSA provenance and the GitHub attestation that
    # `docs/guide/verifying-attestations.md` tells people to check, and
    # rebuilding it here would produce something nobody has attested. 120MB
    # compressed, so a cold pull is not the slow part.
    runtime: image
    image:
      url: ghcr.io/unknown122-coder/vexpath:0.1.5
    # Next to the database, not next to the author. Every page makes several
    # round trips to Postgres -- authentication, the tenant context, the
    # query -- and the Neon project is in ap-southeast-1, so this is
    # Singapore. Move both together or neither: Oregon would add a fifth of a
    # second to every one of those trips.
    region: singapore
    plan: free
    # Readiness, not liveness. This is what Render gates a deploy on, and
    # /readyz answers 503 while the database is unreachable -- so a release
    # that cannot reach Neon never replaces the one that can. /healthz is the
    # independent liveness probe the container's own HEALTHCHECK uses.
    healthCheckPath: /readyz

    envVars:
      # The image's CMD binds 8000, so Render is told rather than left to
      # discover it.
      - key: PORT
        value: 8000

      - key: VEXPATH_ENV
        value: production
      - key: VEXPATH_LOG_FORMAT
        value: json

      # Production refuses to start unless this is https: the session cookie
      # is Secure, so over plain http a browser would never send it back and
      # sign-in would fail silently on every attempt. This has to match the
      # hostname Render actually serves, which follows the service name above
      # -- if `vexpath` is already taken on onrender.com, both change
      # together, along with the OAuth app's callback URL.
      - key: VEXPATH_BASE_URL
        value: https://vexpath.onrender.com

      # Render terminates TLS at its edge and sets X-Forwarded-For, so the
      # header can be believed here -- and only behind a proxy. Believing it
      # without one lets a caller dodge their own rate limit by varying it,
      # and exhaust somebody else's by claiming their address.
      - key: VEXPATH_TRUST_PROXY_HEADERS
        value: "true"
      - key: VEXPATH_RATE_LIMIT_ENABLED
        value: "true"

      # Generated by Render, once, and never seen by anybody. This key signs
      # sessions and CSRF tokens and encrypts stored webhook secrets, so
      # rotating it logs everybody out and makes those secrets unreadable --
      # which is why it is generated here rather than pasted from somewhere
      # it might also live.
      - key: VEXPATH_SECRET_KEY
        generateValue: true

      # Entered once in the dashboard during Blueprint creation. Neon's
      # pooled connection string, with sslmode=require.
      - key: VEXPATH_DATABASE_URL
        sync: false

# Deliberately absent, and each for a reason:
#
# - No disk. The Fly deployment mounts one for the advisory snapshot and the
#   call-graph cache, but nothing in apps/api reads either: the corpus the
#   package pages serve lives in Postgres, put there by `seed-advisories`.
#   A disk on Render is a paid feature and this needs none.
#
# - No preDeployCommand, which is paid-only. Migrations therefore run from a
#   laptop against Neon before the first deploy, and again after any release
#   that adds one -- docs/09-deployment.md has the command. That is a real
#   downgrade from Fly's release_command, where a failed migration stopped the
#   deploy, so it is written down rather than remembered.
#
# - No GITHUB_CLIENT_ID/SECRET. They are optional: without them sign-in is
#   simply unavailable and every public page -- reports, package pages, the
#   badge -- works as it does now. Add them in the dashboard once an OAuth app
#   exists for this hostname.
#
# - No autoDeploy. It has no effect on a prebuilt image: a new release is
#   picked up by bumping the pinned tag above, or by "Deploy latest reference"
#   in the dashboard.
