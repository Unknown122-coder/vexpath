[project]
name = "vexpath-workspace"
version = "0.0.0"
description = "Workspace root for the software supply-chain security platform. Not published."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Akmal Khan" }]
dependencies = [
    "vexpath-core",
    "vexpath-platform",
    "vexpath-db",
    "vexpath",
    "vexpath-api",
    "vexpath-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/platform",
    "packages/db",
    "packages/cli",
    "apps/api",
    "apps/worker",
]

[tool.uv.sources]
vexpath-core = { workspace = true }
vexpath-platform = { workspace = true }
vexpath-db = { workspace = true }
vexpath = { workspace = true }
vexpath-api = { workspace = true }
vexpath-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.8",
    # Starlette's test client requires httpx2; httpx 0.x is what vexpath_core
    # uses for its own outbound calls, so both are present deliberately.
    "httpx>=0.28",
    "httpx2>=0.29",
    "types-pyyaml>=6.0",
    "playwright>=1.65.0",
]

# ---------------------------------------------------------------------------
# Lint and format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["testdata/repos", "packages/db/src/vexpath_db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # naive datetimes
    "T20",       # no print outside the CLI
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",
    "S",         # bandit: this is a security tool, it should hold itself to it
    "BLE",       # no bare or blanket excepts without a stated reason
]
ignore = [
    "S101",      # assert is fine in tests and internal invariants
    "E501",      # line length is handled by the formatter
    "A003",      # domain models legitimately have fields named id, type, format
]

[tool.ruff.lint.per-file-ignores]
"packages/cli/**" = ["T20"]          # the CLI prints by design
"**/tests/**" = ["S", "T20"]
"tools/**" = ["T20"]               # developer scripts report progress
"packages/db/src/vexpath_db/migrations/**" = ["N999", "T20", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["vexpath_core", "vexpath_platform", "vexpath_db", "vexpath", "vexpath_api", "vexpath_worker"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["testdata/repos", "packages/db/src/vexpath_db/migrations/versions"]

[[tool.mypy.overrides]]
# Third-party packages without complete type information.
module = [
    "packageurl.*",
    "msgpack.*",
    "procrastinate.*",
    "spdx_tools.*",
    "celpy.*",
    "sigstore.*",
    # An optional extra, so the import is guarded and the module may be absent.
    "sentry_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Strictness is enforced on the analysis core; apps are checked less aggressively
# because framework decorators defeat a lot of inference.
module = ["vexpath_api.*", "vexpath_worker.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
# infra/ holds the deployment configuration and the tests that check it:
# a release command that would not migrate, or a health check pointed at the
# wrong probe, is only visible after a deploy otherwise.
testpaths = ["packages", "apps", "infra"]
pythonpath = ["."]
# importlib import mode: several packages have a tests/ directory, and the
# default mode would collide on identically named modules.
# The browser acceptance suite is deselected here and run on its own by
# `make e2e`. That is not tidiness: Playwright drives its browser through a
# subprocess, which needs the proactor event loop on Windows, and psycopg's
# asynchronous mode needs the selector one. The policy is process-wide, so a
# run that mixed them would leave whichever came second unable to work --
# which it did, as 387 errors in one run and none in either suite alone.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not e2e'"
asyncio_mode = "auto"
# Pin the fixture loop scope rather than inherit a default that pytest-asyncio
# is in the middle of changing.
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Postgres and MinIO (docker compose up)",
    "network: reaches the public internet; skipped by default in CI",
    "benchmark: the reachability benchmark set; slow",
    "e2e: drives a real browser; must run in its own process (see addopts)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = [
    "packages/core/src",
    "packages/platform/src",
    "packages/db/src",
    "packages/cli/src",
    "apps/api/src",
    "apps/worker/src",
]

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
