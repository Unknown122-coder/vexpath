name: module-level
description: >
  The vulnerable symbol is a module, not a function: the fix changed code at
  module scope, so importing it is enough to execute the change. Reaching the
  import must therefore count as reaching the symbol, even though no call edge
  points at it.
lockfile: requirements.txt
entry_points:
  - app.config:load
expected:
  - advisory: CVE-2020-14343
    component: pkg:pypi/pyyaml@5.3.1
    verdict: affected
    reach_status: reachable_confirmed
    confidence: high
    must_include_symbols:
      - yaml.constructor
